name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      # Die vier Tests pinnen die drei Befunde aus der README. Sie sind der
      # Grund, dass eine Versionsaenderung die Seite laut falsch macht statt
      # still — genau das sagt der Scope-Abschnitt zu.
      - name: pytest
        run: pytest -q
