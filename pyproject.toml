[project]
name = "langgraph-pause-probe"
version = "0.1.0"
description = "Reproduces two documented ADK 2.0 graph limits against LangGraph and measures what happens"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["probe"]
